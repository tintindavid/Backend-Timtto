# railway.toml - minimal configuration for deploying TimttoApp to Railway
#
# This file provides a basic service definition and recommended environment
# variables. DO NOT commit real secrets here. Set sensitive values (DB URI,
# JWT_SECRET, firebase keys, etc.) in the Railway project environment UI.

[project]
name = "timttoapp"

[[services]]
name = "web"
path = "."
# Start the app directly from source — works for local dev and on Railway when
# you prefer to run JS from `src/`. If you build to `dist/` in CI, adjust to
# `npm run start` instead.
start = "node --enable-source-maps src/server.js"
build = "npm ci && npm run build"

# DO NOT declare environment variables in this file.
# Empty placeholders like `KEY = ""` are interpreted by Railway's BuildKit-based
# nixpacks as secret references with empty IDs and break the build with:
#   "secret ID missing for \"\" environment variable"
#
# Required environment variables (set them in Railway → Service → Variables):
#
#   MONGO_URI                  MongoDB connection string (or MONGO_URL)
#   JWT_SECRET                 Panel token signing secret
#   JWT_PUBLIC_SECRET          Public-portal sessionToken signing secret.
#                              MUST differ from JWT_SECRET. Server refuses to
#                              start otherwise (see src/config/jwt.config.js).
#   JWT_EXPIRES_IN             e.g. "7d"
#   JWT_PUBLIC_EXPIRES_IN      e.g. "2h"
#   PUBLIC_APP_BASE_URL        e.g. "https://app.timtto.com" — used to build the
#                              landing URL printed in QR PNGs.
#   CORS_ORIGIN                Comma-separated list of allowed frontend origins
#   NODE_ENV                   "production"
#
# Optional: FIREBASE_CONFIG, FIREBASE_STORAGE_BUCKET, SENTRY_DSN,
#           QR_IMAGE_STORAGE_PATH, RATE_LIMIT_*, LOG_LEVEL,
#           PDF_SERVICE_URL, PDF_MICROSERVICE_TIMEOUT.
#
# Railway provides PORT automatically; do not override here.
